<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FilmRec — Your Personal Film Guide</title>
  <meta name="description" content="FilmRec is a personal movie and TV recommendation platform — rate what you've watched, build a watchlist, and get picks tailored to your taste across every genre."/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0f'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='700' fill='%232563eb' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e14;
      --surface: #101722;
      --elevated: #1c2740;
      --blue: #3a63dd;
      --blue-hover: #4f78ee;
      --blue-glow: rgba(58,99,221,0.35);
      --text: #e8eaf0;
      --muted: #8892a4;
      --gold: #e0a838;
      --danger: #e5484d;
      --success: #2fb673;
      --border: rgba(255,255,255,0.07);
      --radius: 12px;
      --card-radius: 10px;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: 0.4;
    }

    #root { position: relative; z-index: 1; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--elevated); border-radius: 3px; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px; display: flex; align-items: center; padding: 0 24px; gap: 8px;
      background: rgba(10,10,15,0.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { font-family: var(--font-display); font-size: 1.7rem; color: var(--blue); letter-spacing: 2px; text-decoration: none; flex-shrink: 0; cursor: pointer; margin-right: 8px; }
    .nav-link {
      padding: 8px 14px; border-radius: 8px; color: var(--muted); font-size: 0.88rem; font-weight: 500;
      cursor: pointer; border: none; background: none; transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .nav-link:hover { color: var(--text); background: var(--elevated); }
    .nav-link.active { color: var(--text); background: var(--elevated); }
    .nav-spacer { flex: 1; }
    .nav-icon-btn {
      width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255,255,255,0.06);
      color: var(--text); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; flex-shrink: 0;
    }
    .nav-icon-btn:hover { background: var(--elevated); }
    .nav-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s; background-size: cover; background-position: center; flex-shrink: 0; }
    .nav-avatar:hover { border-color: var(--blue); }

    .search-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 400; display: flex; justify-content: center; padding-top: 90px; backdrop-filter: blur(4px); }
    .search-modal { width: 100%; max-width: 640px; padding: 0 20px; }
    .search-modal input {
      width: 100%; background: var(--surface); border: 2px solid var(--blue); border-radius: 14px;
      padding: 16px 20px; color: var(--text); font-size: 1.1rem; outline: none;
    }
    .search-modal-results { margin-top: 12px; background: var(--surface); border-radius: 14px; border: 1px solid var(--border); max-height: 60vh; overflow-y: auto; }
    .search-result-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; transition: background 0.15s; }
    .search-result-item:hover { background: var(--elevated); }
    .search-thumb { width: 42px; height: 63px; border-radius: 5px; object-fit: cover; background: var(--elevated); flex-shrink: 0; }
    .search-info .title { font-weight: 500; font-size: 0.95rem; }
    .search-info .meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    .main { padding: 88px 40px 40px; max-width: 1500px; margin: 0 auto; }

    .hero {
      position: relative; border-radius: 20px; overflow: hidden; margin-bottom: 48px;
      min-height: 420px; display: flex; align-items: flex-end;
      background: linear-gradient(135deg, var(--surface) 0%, #0d1f3c 100%);
    }
    /* Sprocket-hole edges — the one flourish this page keeps, standing in
       for a film strip rather than reaching for a generic gradient accent. */
    .hero::before, .hero::after {
      content: ''; position: absolute; left: 0; right: 0; height: 13px; z-index: 3;
      background-image: radial-gradient(circle, rgba(0,0,0,0.6) 0 3px, transparent 3.5px);
      background-size: 26px 13px; background-position: 13px center; background-repeat: repeat-x;
    }
    .hero::before { top: 0; }
    .hero::after { bottom: 0; }
    .hero-backdrop { position: absolute; inset: 0; object-fit: cover; width: 100%; height: 100%; opacity: 0.4; }
    .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,15,0.98) 0%, rgba(10,10,15,0.5) 50%, transparent 100%); }
    .hero-content { position: relative; z-index: 2; padding: 40px; max-width: 600px; }
    .hero-label { font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--blue); margin-bottom: 8px; }
    .hero-title { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 4rem); line-height: 0.95; margin-bottom: 12px; }
    .hero-desc { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; max-width: 480px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .hero-meta { display: flex; gap: 16px; margin-bottom: 16px; font-size: 0.85rem; color: var(--muted); align-items: center; }
    .hero-rating { color: var(--gold); font-weight: 600; }

    .btn { padding: 10px 22px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.18s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-hover); box-shadow: 0 0 20px var(--blue-glow); }
    .btn-ghost { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: rgba(255,255,255,0.14); }
    .btn-sm { padding: 6px 14px; font-size: 0.82rem; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    .section { margin-bottom: 48px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .section-title { font-family: var(--font-display); font-size: 1.8rem; letter-spacing: 1px; }
    .section-subtitle { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }

    .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 28px; }
    .filter-select {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 14px; color: var(--text); font-size: 0.85rem; cursor: pointer; outline: none;
    }
    .filter-select:focus { border-color: var(--blue); }

    .carousel { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; scroll-snap-type: x mandatory; }
    .carousel::-webkit-scrollbar { display: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }

    .card {
      flex-shrink: 0; width: 160px; cursor: pointer;
      border-radius: var(--card-radius); overflow: hidden;
      background: var(--surface); transition: transform 0.2s;
      scroll-snap-align: start;
    }
    .grid .card { width: 100%; }
    .card:hover { transform: translateY(-4px); }
    .card:hover .card-poster { box-shadow: 0 0 0 2px var(--blue), 0 0 20px var(--blue-glow); }
    .card-poster {
      width: 100%; aspect-ratio: 2/3; object-fit: cover;
      background: var(--elevated); display: block;
      transition: box-shadow 0.2s;
    }
    .card-poster-placeholder { width: 100%; aspect-ratio: 2/3; background: var(--elevated); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 2rem; }
    .card-body { padding: 10px; }
    .card-title { font-size: 0.82rem; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 0.73rem; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
    .card-rating { color: var(--gold); }
    .card-add { width: 100%; margin-top: 6px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
    .modal {
      background: var(--surface); border-radius: 16px; max-width: 760px; width: 100%;
      max-height: 90vh; overflow-y: auto; border: 1px solid var(--border);
    }
    .modal-backdrop img { width: 100%; height: 280px; object-fit: cover; border-radius: 16px 16px 0 0; display: block; }
    .modal-backdrop-placeholder { width: 100%; height: 280px; background: linear-gradient(135deg, var(--elevated), #0d1f3c); border-radius: 16px 16px 0 0; display: flex; align-items: center; justify-content: center; font-size: 4rem; color: var(--muted); }
    .modal-body { padding: 28px; }
    .modal-title { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; margin-bottom: 6px; }
    .modal-tagline { color: var(--muted); font-style: italic; margin-bottom: 12px; }
    .modal-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 0.85rem; color: var(--muted); }
    .modal-overview { color: var(--muted); line-height: 1.7; font-size: 0.92rem; margin-bottom: 20px; }
    .modal-genres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .genre-tag { background: var(--elevated); border-radius: 20px; padding: 4px 12px; font-size: 0.78rem; color: var(--muted); }
    .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
    .modal-section-label { font-weight: 600; margin-bottom: 12px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

    .cast-scroll { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .cast-scroll::-webkit-scrollbar { display: none; }
    .cast-card { flex-shrink: 0; width: 84px; text-align: center; }
    .cast-photo { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; background: var(--elevated); margin-bottom: 6px; }
    .cast-photo-placeholder { width: 84px; height: 84px; border-radius: 50%; background: var(--elevated); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: var(--muted); margin-bottom: 6px; }
    .cast-name { font-size: 0.76rem; font-weight: 500; line-height: 1.2; }
    .cast-character { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    .star-rating { display: flex; gap: 4px; align-items: center; }
    .star { font-size: 1.4rem; cursor: pointer; color: var(--border); transition: color 0.1s; }
    .star.filled { color: var(--gold); }
    .star-label { font-size: 0.85rem; color: var(--muted); margin-left: 8px; min-width: 40px; }

    .form-card { max-width: 440px; margin: auto; background: var(--surface); border-radius: 16px; border: 1px solid var(--border); padding: 40px; }
    .form-logo { font-family: var(--font-display); font-size: 2.4rem; color: var(--blue); letter-spacing: 2px; text-align: center; margin-bottom: 8px; }
    .form-subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], input[type="email"], input[type="password"], textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 14px; color: var(--text);
      font-size: 0.92rem; outline: none; transition: border-color 0.2s;
      font-family: var(--font-body);
    }
    input:focus, textarea:focus { border-color: var(--blue); }
    textarea { resize: vertical; min-height: 80px; }
    .form-error { color: var(--danger); font-size: 0.82rem; margin-top: 4px; }
    .form-success { color: var(--success); font-size: 0.85rem; text-align: center; margin-bottom: 16px; }
    .form-footer { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
    .form-footer a { color: var(--blue); text-decoration: none; cursor: pointer; }

    .profile-header { background: var(--surface); border-radius: 16px; padding: 32px; margin-bottom: 32px; border: 1px solid var(--border); display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
    .avatar-upload-wrap { position: relative; flex-shrink: 0; }
    .profile-avatar { width: 96px; height: 96px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; border: 3px solid var(--elevated); background-size: cover; background-position: center; }
    .avatar-edit-btn {
      position: absolute; bottom: 0; right: 0; width: 32px; height: 32px; border-radius: 50%;
      background: var(--blue); border: 3px solid var(--surface); color: #fff; font-size: 0.8rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .avatar-edit-btn:hover { background: var(--blue-hover); }
    .profile-info .username { font-family: var(--font-display); font-size: 2rem; letter-spacing: 1px; }
    .profile-info .display-name { color: var(--muted); margin-bottom: 8px; }
    .profile-info .bio { color: var(--muted); font-size: 0.9rem; line-height: 1.6; max-width: 480px; }
    .profile-stats { display: flex; gap: 24px; margin-top: 16px; }
    .stat { text-align: center; }
    .stat-value { font-family: var(--font-display); font-size: 1.6rem; color: var(--blue); }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .watchlist-card { position: relative; border-radius: var(--card-radius); overflow: hidden; background: var(--surface); cursor: pointer; }
    .watchlist-card:hover .watchlist-remove { opacity: 1; }
    .watchlist-remove { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity 0.2s; background: rgba(10,10,15,0.85); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; color: var(--danger); font-size: 0.9rem; }
    .watchlist-remove:hover { background: var(--danger); color: #fff; }

    .ratings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .rating-item { background: var(--surface); border-radius: var(--card-radius); padding: 16px; display: flex; gap: 14px; border: 1px solid var(--border); }
    .rating-thumb { width: 60px; height: 90px; border-radius: 6px; object-fit: cover; background: var(--elevated); flex-shrink: 0; cursor: pointer; }
    .rating-info .title { font-weight: 600; cursor: pointer; }
    .rating-info .title:hover { color: var(--blue); }
    .rating-score { color: var(--gold); font-size: 0.9rem; margin: 4px 0; }

    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 0.88rem; min-width: 220px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); animation: slideIn 0.2s ease; }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error { border-left: 3px solid var(--danger); }
    @keyframes slideIn { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }

    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
    .tab { padding: 12px 20px; font-size: 0.9rem; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.2s, border-color 0.2s; background: none; border-left: none; border-right: none; border-top: none; }
    .tab.active { color: var(--text); border-bottom-color: var(--blue); }

    .import-box { background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
    .import-box:hover { border-color: var(--blue); }
    .import-icon { font-size: 2rem; margin-bottom: 12px; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-movie { background: rgba(37,99,235,0.2); color: var(--blue); }
    .badge-tv { background: rgba(139,95,199,0.2); color: #8b5fc7; }
    .divider { height: 1px; background: var(--border); margin: 24px 0; }
    .page-title { font-family: var(--font-display); font-size: 2.6rem; letter-spacing: 1px; margin-bottom: 8px; }
    .page-subtitle { color: var(--muted); margin-bottom: 32px; }

    .app-footer {
      border-top: 1px solid var(--border); margin-top: 40px; padding: 24px 0 8px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      font-size: 0.78rem; color: var(--muted);
    }
    .app-footer a { color: var(--muted); text-decoration: none; }
    .app-footer a:hover { color: var(--blue); }

    .feed-container {
      height: calc(100vh - 64px); margin-top: 64px; overflow-y: scroll; scroll-snap-type: y mandatory;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; padding-top: 64px;
    }
    .feed-card {
      height: calc(100vh - 64px); scroll-snap-align: start; position: relative;
      display: flex; align-items: flex-end; justify-content: center;
      background: var(--surface);
    }
    .feed-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .feed-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0.5) 100%); }
    .feed-content { position: relative; z-index: 2; padding: 32px; width: 100%; max-width: 640px; margin: 0 auto; }
    .feed-title { font-family: var(--font-display); font-size: 2.4rem; margin-bottom: 8px; }
    .feed-meta { display: flex; gap: 14px; font-size: 0.85rem; color: #ccc; margin-bottom: 12px; align-items: center; }
    .feed-overview { color: #ddd; font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .feed-actions { display: flex; gap: 12px; }
    .feed-hint { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 0.8rem; z-index: 50; display: flex; align-items: center; gap: 6px; }

    /* === BOTTOM TAB BAR (mobile only) === */
    .bottom-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
      background: rgba(10,10,15,0.96); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
      justify-content: space-around; align-items: center;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .bottom-nav::-webkit-scrollbar { display: none; }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: none; border: none; color: var(--muted); font-size: 0.62rem;
      padding: 6px 4px; min-width: 52px; flex-shrink: 0; cursor: pointer; border-radius: 8px;
    }
    .bottom-nav-item .icon { font-size: 1.25rem; line-height: 1; }
    .bottom-nav-item.active { color: var(--blue); }

    /* ============================================================
       RESPONSIVE BREAKPOINTS
       Tablet (<=900px): top nav labels collapse to icons where possible.
       Phone (<=680px): top nav becomes logo+search+avatar only;
       primary navigation moves to the bottom tab bar; content, modals,
       forms, grids and touch targets all resize for one-handed use.
       ============================================================ */

    @media (max-width: 900px) {
      .nav-link { display: none; }
      .bottom-nav { display: flex; }
      .main { padding-bottom: 88px; }
      .feed-container { padding-bottom: 76px; }
      .feed-card { height: calc(100vh - 64px - 76px); }
      .feed-hint { bottom: 88px; }
    }

    @media (max-width: 680px) {
      /* Nav */
      nav { padding: 0 12px; height: 58px; gap: 6px; }
      .nav-logo { font-size: 1.4rem; margin-right: 2px; }

      .modal-body { padding: 20px; }
      .modal-title { font-size: 1.7rem; }
      .modal-actions { flex-direction: column; }
      .modal-actions .btn { width: 100%; justify-content: center; }
      .cast-photo, .cast-photo-placeholder { width: 68px; height: 68px; }
      .cast-card { width: 68px; }

      /* Forms */
      .form-card { padding: 28px 22px; border-radius: 14px; }
      .form-logo { font-size: 2rem; }

      /* Profile */
      .profile-header { padding: 22px; gap: 18px; }
      .profile-avatar { width: 80px; height: 80px; font-size: 2rem; }
      .profile-info .username { font-size: 1.6rem; }

      /* Ratings list stacks to one column, thumb+text stays legible */
      .ratings-grid { grid-template-columns: 1fr; }

      /* Watchlist / discover grid tighter on phones */
      .watchlist-card, .grid .card { width: 100%; }

      /* Feed */
      .feed-content { padding: 20px; padding-bottom: 28px; }
      .feed-title { font-size: 1.9rem; }
      .feed-overview { font-size: 0.85rem; -webkit-line-clamp: 2; }
      .feed-actions { flex-direction: column; }
      .feed-actions .btn { width: 100%; justify-content: center; }
    }

    @media (max-width: 400px) {
      .card { width: 116px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>

// Access tokens are short-lived (1 hour) by design, so this runs

  if (res.status === 401) {
